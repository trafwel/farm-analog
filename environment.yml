name: farm-analog
channels:
  - conda-forge
dependencies:
  - python=3.11
  # gridded data
  - xarray
  - rioxarray
  - rasterio
  - netcdf4
  - dask
  - xclim
  # analysis
  - numpy
  - scipy
  - scikit-learn
  - pandas
  - geopandas
  - pyarrow
  # Earth Engine
  - earthengine-api
  - geemap
  # app and charts
  - streamlit
  - leafmap
  - plotly
  # data contract
  - pydantic>=2
  # API (M5)
  - fastapi
  - uvicorn
  - httpx
  - shapely
  - pyproj
  # notebooks and utilities
  - jupyterlab
  - ipykernel
  - python-dotenv
  - requests
  # testing and linting
  - pytest
  - ruff
  - pip
  - pip:
      - anthropic
      - -e .
